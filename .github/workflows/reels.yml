name: Reels to Instagram and Facebook

# Two Reels a day on each platform, each re-shared to Stories right after.
# GitHub cron is UTC:
#   13:00 UTC = 7:00 am Central in winter (8:00 am in summer)
#   22:30 UTC = 4:30 pm Central in winter (5:30 pm in summer)
# HeyCatch posts at about :33 past 4 am, 12 pm and 8 pm Central, so both
# slots stay 2+ hours clear of it all year. The script also skips a platform
# if anything went up there in the last 90 minutes.
on:
  schedule:
    # Each slot has two backups 20 and 40 minutes later, because GitHub can
    # start a scheduled run late or skip it (the first 22:30 run never came).
    # The script posts once per slot; later runs see it and stop.
    - cron: "0 13 * * *"
    - cron: "20 13 * * *"
    - cron: "40 13 * * *"
    - cron: "30 22 * * *"
    - cron: "50 22 * * *"
    - cron: "10 23 * * *"
  workflow_dispatch:
    inputs:
      platforms:
        description: "any of instagram,facebook,instagram_story,facebook_story"
        default: "instagram,facebook,instagram_story,facebook_story"
      slug:
        description: "Force one video (optional), e.g. spare-part"
        default: ""
      dry_run:
        description: "1 = only print the pick and captions"
        default: "0"

permissions:
  contents: write

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Post the next Reel
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          PLATFORMS: ${{ inputs.platforms || 'instagram,facebook,instagram_story,facebook_story' }}
          SLUG: ${{ inputs.slug }}
          DRY_RUN: ${{ inputs.dry_run || '0' }}
        run: python3 reels/post_reels.py
      - name: Save the posting log
        if: always()
        run: |
          git config user.name "yardswaps-reels-bot"
          git config user.email "yardswaps@gmail.com"
          git add reels/posted.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Reels log $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
