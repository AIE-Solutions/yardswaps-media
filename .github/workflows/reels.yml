name: Reels to Instagram and Facebook

# Ten Reels a day on each platform (Nov 23; nine from Nov 20, eight from Nov 18, seven from Nov 13, four from Nov 8, up from two), each re-shared to
# Stories right after and shared to Threads (once THREADS_TOKEN is set).
# Slots are set in Central time in reels/post_reels.py (SLOTS_CT), so they
# don't move when daylight saving changes:
#   12:40, 6:10, 7:00, 8:30, 10:00 am, 3:55, 5:15, 6:30, 10:10 and 11:40 pm Central
# each with a short window (see post_reels.py) that keeps every post 90+
# minutes from HeyCatch (about :33 past 4 am, 12 pm and 8 pm Central) and the
# 2:15 pm Just listed post.
on:
  schedule:
    # GitHub starts scheduled runs here late or drops them (Nov 22-23: 7 of 26
    # crons ran, most 30 minutes to 4 hours late), and the Claude scheduled
    # tasks that used to dispatch each slot are refused by the agent safety
    # check since Nov 22. So these crons fire every 10 minutes through every
    # slot window, in both winter (UTC-6) and summer (UTC-5) time; the first
    # run that lands inside a window posts, and the cheap gate job stops the
    # rest in seconds (no video checkout).
    - cron: "3,13,23,33,43,53 11-16 * * *"   # 6:10 am to 11:00 am slots
    - cron: "3,13,23,33,43,53 20-23 * * *"   # 3:55 pm to 6:00 pm slots (and 6:30 pm in summer)
    - cron: "3,13,23,33,43,53 0 * * *"       # 6:30 pm slot in winter
    - cron: "3,13,23,33,43,53 3-7 * * *"     # 10:10 pm, 11:40 pm and 12:40 am slots
  workflow_dispatch:
    inputs:
      platforms:
        description: "any of instagram,facebook,instagram_story,facebook_story,threads"
        default: "instagram,facebook,instagram_story,facebook_story,threads"
      slug:
        description: "Force one video (optional), e.g. spare-part"
        default: ""
      dry_run:
        description: "1 = only print the pick and captions"
        default: "0"
      image_slug:
        description: "One-off IMAGE post from reels/images.json (skips the Reels queue), e.g. snap-it"
        default: ""
      promo:
        description: "A reels/promos.json id (founding, share) = make this run the promotion post (optional)"
        default: ""

permissions:
  contents: write

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  image:
    # One-off image post (feed + Stories on IG and FB) from reels/images.json.
    if: inputs.image_slug != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Post the image
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IMAGE_SLUG: ${{ inputs.image_slug }}
          PLATFORMS: ${{ inputs.platforms || 'instagram,facebook,instagram_story,facebook_story' }}
          DRY_RUN: ${{ inputs.dry_run || '0' }}
        run: python3 reels/post_image.py
      - name: Save the image log
        if: always()
        run: |
          git config user.name "yardswaps-reels-bot"
          git config user.email "yardswaps@gmail.com"
          git add reels/images-posted.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Image post log"
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git push origin HEAD:${GITHUB_REF_NAME}

  gate:
    if: inputs.image_slug == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.check.outputs.due }}
      at: ${{ steps.check.outputs.at }}
    steps:
      # ref = the branch, not the commit the run was queued at, so a run that
      # waited behind another (concurrency below) sees its posting log.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          sparse-checkout: |
            reels/post_reels.py
            reels/library.json
            reels/posted.json
            reels/tiktok-posted.json
            reels/heycatch-tiktok.json
            reels/images-posted.json
            rotation
            listings/posted.json
            listings/queue.json
            stories/posted.json
          sparse-checkout-cone-mode: false
      - name: Is a slot open?
        id: check
        env:
          CHECK_ONLY: "1"
          PLATFORMS: ${{ inputs.platforms || 'instagram,facebook,instagram_story,facebook_story,threads' }}
          SLUG: ${{ inputs.slug }}
          DRY_RUN: ${{ inputs.dry_run || '0' }}
        run: python3 reels/post_reels.py

  post:
    needs: gate
    if: needs.gate.outputs.due == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Post the next Reel
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          PLATFORMS: ${{ inputs.platforms || 'instagram,facebook,instagram_story,facebook_story,threads' }}
          SLUG: ${{ inputs.slug }}
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          PROMO: ${{ inputs.promo }}
          # The gate's time: the full checkout takes 4-5 minutes, so the slot
          # is judged by when the gate found it open (post_reels.py SLOT_AT).
          SLOT_AT: ${{ needs.gate.outputs.at }}
        run: python3 reels/post_reels.py
      - name: Save the posting log
        if: always()
        run: |
          git config user.name "yardswaps-reels-bot"
          git config user.email "yardswaps@gmail.com"
          git add reels/posted.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Reels log $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
