name: Videos to TikTok

# Two TikToks a day through Buffer's free plan (see reels/post_tiktok.py for
# why not TikTok's own API): 7:42 am and 2:42 pm Central, all 90+
# minutes clear of HeyCatch's 4:33 am / 12:33 pm / 8:33 pm. Cut from five on
# Nov 10 after TikTok blocked posts as potential spam; after any spam block
# the script posts nothing for 72 hours.
# GitHub's own cron on this repo often starts hours late or not at all, so a
# Claude scheduled task dispatches this workflow at :42 past 7, 8, 10, 14, 16
# and 18 Central; the script's 220-minute gap and cap of 2 mean only the
# 7:42 and 2:42 runs post. The crons below are the winter-time backup. Safe to run any
# time: at most 2 in 20 hours, never within 220 minutes of our last TikTok,
# and the publish time moves if it lands within 90 minutes of a HeyCatch slot.
# The script hands each video to Buffer 5 minutes ahead; Buffer publishes it.
on:
  schedule:
    - cron: "42 13 * * *"
    - cron: "42 20 * * *"
  workflow_dispatch:
    inputs:
      slug:
        description: "Force one video (optional), e.g. spare-part"
        default: ""
      dry_run:
        description: "1 = only print the pick, link and caption"
        default: "0"
      check:
        description: "1 = only check the Buffer key and TikTok channel"
        default: "0"

permissions:
  contents: write

concurrency:
  group: tiktok
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Post the next TikTok
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          SLUG: ${{ inputs.slug }}
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          CHECK: ${{ inputs.check || '0' }}
        run: python3 reels/post_tiktok.py
      - name: Save the posting log
        if: always()
        run: |
          git config user.name "yardswaps-reels-bot"
          git config user.email "yardswaps@gmail.com"
          git add reels/tiktok-posted.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "TikTok log $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
