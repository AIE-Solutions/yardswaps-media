name: Videos to TikTok

# Two TikToks a day through Buffer's free plan (see reels/post_tiktok.py for
# why not TikTok's own API), one in each Central-time window: 7:42-9:40 am and
# 2:42-4:40 pm, both 90+ minutes clear of HeyCatch's 4:33 am / 12:33 pm /
# 8:33 pm. Cut from five on Nov 10 after TikTok blocked posts as potential
# spam; after any spam block the script posts nothing for 72 hours.
# GitHub's cron here starts runs late or drops some, and the Claude scheduled
# tasks that used to dispatch this workflow are refused by the agent safety
# check since Nov 22, so GitHub's own schedule tries each window three times
# (Central-time crons, so daylight saving needs no edits). A cheap gate job
# (no video checkout, one billed minute) lets only the first run in a window
# post. Still capped at 2
# in 20 hours and never within 220 minutes of our last TikTok. The script
# hands each video to Buffer 5 minutes ahead; Buffer publishes it.
on:
  schedule:
    - cron: "45 7 * * *"        # 7:42-9:40 am window
      timezone: "America/Chicago"
    - cron: "20 8 * * *"
      timezone: "America/Chicago"
    - cron: "0 9 * * *"
      timezone: "America/Chicago"
    - cron: "45 14 * * *"       # 2:42-4:40 pm window
      timezone: "America/Chicago"
    - cron: "20 15 * * *"
      timezone: "America/Chicago"
    - cron: "0 16 * * *"
      timezone: "America/Chicago"
  workflow_dispatch:
    inputs:
      slug:
        description: "Force one video (optional), e.g. spare-part"
        default: ""
      dry_run:
        description: "1 = only print the pick, link and caption"
        default: "0"
      check:
        description: "1 = only check the Buffer key and TikTok channel"
        default: "0"

permissions:
  contents: write

concurrency:
  group: tiktok
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.check.outputs.due }}
      at: ${{ steps.check.outputs.at }}
    steps:
      # ref = the branch, not the commit the run was queued at, so a run that
      # waited behind another (concurrency above) sees its posting log.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          sparse-checkout: |
            reels/post_reels.py
            reels/post_tiktok.py
            reels/tiktok-posted.json
          sparse-checkout-cone-mode: false
      - name: Is a TikTok window open?
        id: check
        env:
          CHECK_ONLY: "1"
          SLUG: ${{ inputs.slug }}
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          CHECK: ${{ inputs.check || '0' }}
        run: python3 reels/post_tiktok.py

  post:
    needs: gate
    if: needs.gate.outputs.due == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Post the next TikTok
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          SLUG: ${{ inputs.slug }}
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          CHECK: ${{ inputs.check || '0' }}
          SLOT_AT: ${{ needs.gate.outputs.at }}
        run: python3 reels/post_tiktok.py
      - name: Save the posting log
        if: always()
        run: |
          git config user.name "yardswaps-reels-bot"
          git config user.email "yardswaps@gmail.com"
          git add reels/tiktok-posted.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "TikTok log $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
