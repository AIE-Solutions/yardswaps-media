name: Fetch URLs into the repo

# Downloads files the cloud threads cannot reach (signed CDN links such as
# elevenlabsusercontent.com) and commits them under a folder, so a thread can
# pull them from GitHub. Manual only. Spends nothing.
on:
  workflow_dispatch:
    inputs:
      dest:
        description: "Folder in this repo to write into, e.g. broll/fetch/tractor-ad"
        default: "broll/fetch/in"
      files:
        description: "One per line: <name.ext>=<https url>"
        default: ""

permissions:
  contents: write

concurrency:
  group: fetch-urls
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download
        env:
          DEST: ${{ inputs.dest }}
          FILES: ${{ inputs.files }}
        run: |
          set -e
          case "$DEST" in broll/*|stories/*|reels/*) ;; *) echo "dest must be under broll/, stories/ or reels/"; exit 1;; esac
          mkdir -p "$DEST"
          printf '%s\n' "$FILES" | while IFS= read -r line; do
            line="${line%%$'\r'}"; [ -z "$line" ] && continue
            name="${line%%=*}"; url="${line#*=}"
            case "$name" in *..*|*/*) echo "bad name $name"; exit 1;; esac
            case "$url" in https://*) ;; *) echo "bad url for $name"; exit 1;; esac
            echo "fetch $name"
            curl -fsSL --retry 3 --max-time 300 -o "$DEST/$name" "$url"
          done
          ls -la "$DEST"
      - name: Commit
        run: |
          git config user.name "yardswaps-reels-bot"
          git config user.email "yardswaps@gmail.com"
          git add -A broll stories reels 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Fetch ${{ inputs.dest }} ($(date -u +%Y-%m-%dT%H:%MZ))"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
