name: Runway clip

# Makes one Runway clip (image to video) or one image edit from a photo and
# commits it to broll/. Manual only: nothing runs on a schedule and nothing is
# spent unless someone presses "Run workflow". Needs the repo secret
# RUNWAYML_API_SECRET (a key from dev.runway.com, pay-as-you-go credits).
# Without it the run stops with "not set yet". See broll/README.md and the
# campaign folder's RUNWAY.md for the prompts and the credit math.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "clip (make one) | batch (a shot list, several takes) | estimate (price a shot list, spends nothing) | balance | fetch"
        default: "clip"
      photo:
        description: "broll/in/<file>.jpg in this repo, or an https URL (product_ad: up to 10, comma-separated)"
        default: ""
      prompt:
        description: "Motion, image or ad prompt (machines never drive or dig; no text; phones seen from the back)"
        default: ""
      model:
        description: "gen4_turbo 5/s | gen4.5 12/s | kling3.0_pro 12/s | veo3.1_fast 10/s | veo3.1 20/s | kling3.0_4k 43/s | gen4_image 8 | product_ad 200+"
        default: "gen4_turbo"
      ratio:
        description: "720:1280 (gen4) | 1080:1920 (kling3.0_pro, veo3.1 8 s, gen4_image, product_ad) | 2160:3840 (kling3.0_4k)"
        default: "720:1280"
      duration:
        description: "gen4: 5 or 10 | veo: 4, 6, 8 (8 at 1080p) | kling: 3-15 | product_ad: 4-15"
        default: "5"
      seed:
        description: "Optional integer so a run can be repeated"
        default: ""
      slug:
        description: "Output name, e.g. forklift-yard"
        default: ""
      style:
        description: "product_ad only: comma-separated style/ambience photos (up to 4)"
        default: ""
      info:
        description: "product_ad only: what the product is (max 2,500 characters)"
        default: ""
      audio:
        description: "1 = the model makes sound (costs more on Veo and Kling; default off, we add our music)"
        default: ""
      task:
        description: "fetch only: the Runway task id printed by a run that timed out"
        default: ""
      shots:
        description: "batch/estimate: shot list, e.g. broll/shots/people-ad.json"
        default: ""
      only:
        description: "batch/estimate: comma-separated job ids to run (empty = all)"
        default: ""
      budget:
        description: "batch: the most credits this run may spend (it stops before spending if the estimate is higher)"
        default: ""

permissions:
  contents: write

concurrency:
  group: runway
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow (photo checks, stills saved as JPEG)
        run: python -m pip install -q pillow
      - name: Install ffmpeg (for the reversed opener copy)
        if: inputs.mode == 'clip' || inputs.mode == ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Make the clip
        env:
          RUNWAYML_API_SECRET: ${{ secrets.RUNWAYML_API_SECRET }}
          MODE: ${{ inputs.mode }}
          PHOTO: ${{ inputs.photo }}
          PROMPT: ${{ inputs.prompt }}
          MODEL: ${{ inputs.model }}
          RATIO: ${{ inputs.ratio }}
          DURATION: ${{ inputs.duration }}
          SEED: ${{ inputs.seed }}
          SLUG: ${{ inputs.slug }}
          STYLE: ${{ inputs.style }}
          INFO: ${{ inputs.info }}
          AUDIO: ${{ inputs.audio }}
          TASK: ${{ inputs.task }}
          SHOTS: ${{ inputs.shots }}
          ONLY: ${{ inputs.only }}
          BUDGET: ${{ inputs.budget }}
        run: python broll/runway_clip.py
      - name: Commit the output
        if: inputs.mode != 'balance' && inputs.mode != 'estimate'
        run: |
          git config user.name "yardswaps-reels-bot"
          git config user.email "yardswaps@gmail.com"
          git add broll/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Runway ${{ inputs.mode }} ${{ inputs.slug }}${{ inputs.only }} ($(date -u +%Y-%m-%dT%H:%MZ))"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
