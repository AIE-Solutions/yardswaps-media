name: Runway clip

# Makes one Runway clip (image to video) or one image edit from a photo and
# commits it to broll/. Manual only: nothing runs on a schedule and nothing is
# spent unless someone presses "Run workflow". Needs the repo secret
# RUNWAYML_API_SECRET (a key from dev.runway.com, pay-as-you-go credits).
# Without it the run stops with "not set yet". See broll/README.md and the
# campaign folder's RUNWAY.md for the prompts and the credit math.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "clip (make one) | balance (print credits only) | urls (download the files listed below into dest, spends nothing)"
        default: "clip"
      photo:
        description: "broll/in/<file>.jpg in this repo, or an https URL"
        default: ""
      prompt:
        description: "Motion or edit prompt (no people, no text, no new machines)"
        default: ""
      model:
        description: "gen4_turbo (5 credits/s) | gen4.5 (12/s, 1080p) | gen4_image (edit a photo)"
        default: "gen4_turbo"
      ratio:
        description: "720:1280 (Shorts) | 1280:720 (YouTube) | 1080:1920 / 1920:1080 (gen4.5 only)"
        default: "720:1280"
      duration:
        description: "5 or 10 seconds (video only)"
        default: "5"
      seed:
        description: "Optional integer so a run can be repeated"
        default: ""
      slug:
        description: "Output name, e.g. forklift-yard"
        default: ""
      dest:
        description: "mode=urls only: folder under broll/ to write into"
        default: "broll/fetch/in"
      files:
        description: "mode=urls only: one per line, <name.ext>=<https url>"
        default: ""

permissions:
  contents: write

concurrency:
  group: runway
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download URLs the cloud threads cannot reach (mode=urls)
        if: inputs.mode == 'urls'
        env:
          DEST: ${{ inputs.dest }}
          FILES: ${{ inputs.files }}
        run: |
          set -e
          case "$DEST" in broll/*) ;; *) echo "dest must be under broll/"; exit 1;; esac
          mkdir -p "$DEST"
          printf '%s\n' "$FILES" | while IFS= read -r line; do
            line="${line%%$'\r'}"; [ -z "$line" ] && continue
            name="${line%%=*}"; url="${line#*=}"
            case "$name" in *..*|*/*) echo "bad name $name"; exit 1;; esac
            case "$url" in https://*) ;; *) echo "bad url for $name"; exit 1;; esac
            echo "fetch $name"
            curl -fsSL --retry 3 --max-time 300 -o "$DEST/$name" "$url"
          done
          ls -la "$DEST"
      - name: Install ffmpeg (for the reversed opener copy)
        if: inputs.mode != 'balance' && inputs.mode != 'urls'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Make the clip
        if: inputs.mode != 'urls'
        env:
          RUNWAYML_API_SECRET: ${{ secrets.RUNWAYML_API_SECRET }}
          MODE: ${{ inputs.mode }}
          PHOTO: ${{ inputs.photo }}
          PROMPT: ${{ inputs.prompt }}
          MODEL: ${{ inputs.model }}
          RATIO: ${{ inputs.ratio }}
          DURATION: ${{ inputs.duration }}
          SEED: ${{ inputs.seed }}
          SLUG: ${{ inputs.slug }}
        run: python3 broll/runway_clip.py
      - name: Commit the output
        if: inputs.mode != 'balance'
        run: |
          git config user.name "yardswaps-reels-bot"
          git config user.email "yardswaps@gmail.com"
          git add broll/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Runway clip ${{ inputs.slug }} ($(date -u +%Y-%m-%dT%H:%MZ))"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
