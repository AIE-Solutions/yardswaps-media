name: LIST IT FREE Story

# Daily "LIST IT FREE" Instagram Story (Alan, 2026-11-08). Instagram only:
# never feed posts, Reels, Facebook or Threads; no captions, no comments.
# Started at ~9:27 am Central by a Claude scheduled task. Since 2026-11-22 that
# task's dispatch can be refused, so GitHub's own schedule is the backup: tries
# at 9:27 and 9:50 am Central (Central-time crons, so daylight saving needs no
# edits). Schedule runs always publish, but publish_story.py check skips any
# run outside 9:20 am-noon Central, because GitHub crons here can start hours
# late. A cheap gate job (one billed minute, no image bank checkout) stops a
# run when today's Story is already handled. One publish attempt per Central
# day; a failure is logged and reported, never retried, so the first run that
# reaches Instagram is the only one.
# The Graph API cannot add link stickers, so the link is printed on the image.
on:
  schedule:
    - cron: "27,50 9 * * *"
      timezone: "America/Chicago"
  workflow_dispatch:
    inputs:
      publish:
        description: "true = publish to Instagram Stories; false = render only"
        default: "false"
      machine:
        description: "Leave empty for today's machine (Mon generator ... Sun scissor lift)"
        default: ""
      bg_url:
        description: "Optional https background image; empty = reuse today's or generate with Runway"
        default: ""

permissions:
  contents: write

concurrency:
  group: story
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      already: ${{ steps.check.outputs.already }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule' || inputs.publish == 'true'
        with:
          ref: ${{ github.ref }}
          sparse-checkout: |
            stories/publish_story.py
            stories/posted.json
            reels/post_reels.py
          sparse-checkout-cone-mode: false
      - name: Already posted today, or outside the window?
        id: check
        if: github.event_name == 'schedule' || inputs.publish == 'true'
        env:
          WINDOW_CT: ${{ github.event_name == 'schedule' && '09:20-12:00' || '' }}
        run: python3 stories/publish_story.py check

  story:
    needs: gate
    if: needs.gate.outputs.already != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # A schedule run is the backup for the 9:27 am dispatch, so it publishes.
      PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch tip, not the commit at trigger time: a run queued behind
          # another must see the Story that run just logged.
          ref: ${{ github.ref }}
          sparse-checkout: |
            stories
            reels/post_reels.py
            reels/library.json
            reels/posted.json
            reels/tiktok-posted.json
            reels/heycatch-tiktok.json
            reels/images-posted.json
            rotation
            listings/posted.json
            listings/queue.json
            broll/runway_clip.py
      - name: Already posted today?
        id: check
        if: env.PUBLISH == 'true'
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          WINDOW_CT: ${{ github.event_name == 'schedule' && '09:20-12:00' || '' }}
        run: python3 stories/publish_story.py check
      - name: Background
        id: bg
        if: steps.check.outputs.already != 'true'
        env:
          RUNWAYML_API_SECRET: ${{ secrets.RUNWAYML_API_SECRET }}
          MACHINE: ${{ inputs.machine }}
          BG_URL: ${{ inputs.bg_url }}
        run: python3 stories/make_bg.py
      - uses: actions/setup-node@v4
        if: steps.check.outputs.already != 'true'
        with:
          node-version: 20
      - name: Render
        id: render
        if: steps.check.outputs.already != 'true'
        run: |
          f="stories/out/${{ steps.bg.outputs.date }}-${{ steps.bg.outputs.slug }}-story.jpg"
          cd stories && npm init -y > /dev/null && npm i -s playwright@1.49.1 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          node render_story.js "../${{ steps.bg.outputs.bg }}" "${{ steps.bg.outputs.machine }}" "../$f"
          rm -rf node_modules package.json package-lock.json
          echo "file=$f" >> "$GITHUB_OUTPUT"
      - name: Commit image
        id: commit
        if: steps.check.outputs.already != 'true'
        run: |
          git config user.name "yardswaps-reels-bot"
          git config user.email "yardswaps@gmail.com"
          git add -A stories/out/ stories/bank/
          git diff --cached --quiet || git commit -q -m "Story ${{ steps.bg.outputs.date }} ${{ steps.bg.outputs.machine }}"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Wait for the image URL
        if: env.PUBLISH == 'true' && steps.check.outputs.already != 'true'
        run: |
          url="https://raw.githubusercontent.com/AIE-Solutions/yardswaps-media/${{ steps.commit.outputs.sha }}/${{ steps.render.outputs.file }}"
          for i in $(seq 1 12); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$url")" = "200" ] && exit 0; sleep 5
          done
          echo "image not reachable at $url"; exit 1
      - name: Publish Instagram Story
        id: pub
        if: env.PUBLISH == 'true' && steps.check.outputs.already != 'true'
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          MACHINE: ${{ steps.bg.outputs.machine }}
          IMAGE_URL: https://raw.githubusercontent.com/AIE-Solutions/yardswaps-media/${{ steps.commit.outputs.sha }}/${{ steps.render.outputs.file }}
        run: python3 stories/publish_story.py publish
      - name: Commit log
        if: always() && steps.pub.outcome != 'skipped' && steps.pub.outcome != ''
        run: |
          git add stories/posted.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Story log ${{ steps.bg.outputs.date }}: ${{ steps.pub.outputs.result || 'failed' }}"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      - name: Summary
        if: always()
        run: |
          {
            echo "already=${{ steps.check.outputs.already }}"
            echo "machine=${{ steps.bg.outputs.machine }}"
            echo "result=${{ steps.pub.outputs.result }}"
            echo "media_id=${{ steps.pub.outputs.media_id }}"
            echo "expires=${{ steps.pub.outputs.expires }}"
            echo "detail=${{ steps.pub.outputs.detail }}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
